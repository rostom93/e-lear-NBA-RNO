<section class="register" aria-labelledby="register-title">
  <div class="register__panel">
    <h1 id="register-title">{{ 'auth.register.title' | translate }}</h1>
    <p>{{ 'auth.register.subtitle' | translate }}</p>

    @if (error()) {
      <div class="alert" role="alert">
        {{ 'auth.register.error' | translate }}
        @if (errorDetail()) {
          <span class="alert__detail">{{ errorDetail() }}</span>
        }
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="grid">
        <label class="field" for="register-first-name">
          <span>{{ 'auth.register.firstName' | translate }}</span>
          <input
            id="register-first-name"
            type="text"
            formControlName="first_name"
            autocomplete="given-name"
          />
        </label>

        <label class="field" for="register-last-name">
          <span>{{ 'auth.register.lastName' | translate }}</span>
          <input
            id="register-last-name"
            type="text"
            formControlName="last_name"
            autocomplete="family-name"
          />
        </label>
      </div>

      <label class="field" for="register-email">
        <span>{{ 'auth.email' | translate }}</span>
        <input
          id="register-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        @if (form.controls.email.touched && form.controls.email.hasError('required')) {
          <small class="field__error">{{ 'auth.required' | translate }}</small>
        }
        @if (form.controls.email.touched && form.controls.email.hasError('email')) {
          <small class="field__error">{{ 'auth.emailInvalid' | translate }}</small>
        }
      </label>

      <label class="field" for="register-password">
        <span>{{ 'auth.password' | translate }}</span>
        <input
          id="register-password"
          type="password"
          formControlName="password"
          autocomplete="new-password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        <small class="field__hint">{{ 'auth.register.passwordHint' | translate }}</small>
        @if (form.controls.password.touched && form.controls.password.hasError('required')) {
          <small class="field__error">{{ 'auth.required' | translate }}</small>
        }
        @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
          <small class="field__error">{{ 'auth.register.passwordShort' | translate }}</small>
        }
      </label>

      <label class="field" for="register-confirm">
        <span>{{ 'auth.register.confirm' | translate }}</span>
        <input
          id="register-confirm"
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
        />
        @if (form.controls.confirm.touched && form.hasError('mismatch')) {
          <small class="field__error">{{ 'auth.register.mismatch' | translate }}</small>
        }
      </label>

      <button class="btn btn--primary btn--block" type="submit" [disabled]="submitting()">
        {{ 'auth.register.submit' | translate }}
      </button>
    </form>

    <p class="switch">
      {{ 'auth.haveAccount' | translate }}
      <a routerLink="/auth/login">{{ 'auth.login.title' | translate }}</a>
    </p>
  </div>
</section>
