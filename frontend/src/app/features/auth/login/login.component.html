<section class="login" aria-labelledby="login-title">
  <div class="login__panel">
    <h1 id="login-title">{{ 'auth.login.title' | translate }}</h1>
    <p>{{ 'auth.login.subtitle' | translate }}</p>

    @if (error()) {
      <div class="alert" role="alert">{{ 'auth.error' | translate }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field" for="email">
        <span>{{ 'auth.email' | translate }}</span>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        @if (form.controls.email.touched && form.controls.email.hasError('required')) {
          <small class="field__error">{{ 'auth.required' | translate }}</small>
        }
        @if (form.controls.email.touched && form.controls.email.hasError('email')) {
          <small class="field__error">{{ 'auth.emailInvalid' | translate }}</small>
        }
      </label>

      <label class="field" for="password">
        <span>{{ 'auth.password' | translate }}</span>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field__error">{{ 'auth.required' | translate }}</small>
        }
      </label>

      <button class="btn btn--primary btn--block" type="submit" [disabled]="submitting()">
        {{ 'auth.submit' | translate }}
      </button>
    </form>

    <p class="switch">
      {{ 'auth.noAccount' | translate }}
      <a routerLink="/auth/register">{{ 'auth.register.title' | translate }}</a>
    </p>
  </div>
</section>
