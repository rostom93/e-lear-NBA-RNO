<button
  type="button"
  class="theme-toggle"
  (click)="themeService.toggle()"
  [attr.aria-label]="'theme.toggle' | translate"
  [attr.title]="(themeService.isDark() ? 'theme.light' : 'theme.dark') | translate"
>
  @if (themeService.isDark()) {
    <span aria-hidden="true">☀</span>
  } @else {
    <span aria-hidden="true">☾</span>
  }
</button>
